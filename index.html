<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Glass Background</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    background-color: #050505; /* Глубокий черный */
    height: 100vh;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* Контейнер для волн */
  .waves-container {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 1;
    overflow: hidden;
  }

  /* Общие настройки для извилистых полос */
  .wave {
    position: absolute;
    width: 200vw;
    height: 200vh;
    top: -50vh;
    left: -50vw;
    border-radius: 40%; /* Делает края волны закругленными */
    opacity: 0.15; /* Не сильно яркие */
    filter: blur(40px); /* Размытие для эффекта "стекла" */
  }

  /* Настройки для разных волн (разная скорость и направление) */
  .wave-1 {
    background: radial-gradient(circle, rgba(255,255,255,0.8) 0%, rgba(255,255,255,0) 70%);
    animation: rotateWave 15s infinite linear;
  }

  .wave-2 {
    background: radial-gradient(circle, rgba(200,200,200,0.6) 0%, rgba(200,200,200,0) 70%);
    animation: rotateWave 20s infinite linear reverse;
    opacity: 0.1;
  }

  .wave-3 {
    background: radial-gradient(circle, rgba(255,255,255,0.5) 0%, rgba(255,255,255,0) 60%);
    animation: rotateWave 25s infinite linear;
    opacity: 0.08;
  }

  /* Эффект стеклянного блика поверх всего */
  .glass-overlay {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 2;
    /* Полупрозрачный градиент, имитирующий стекло */
    background: linear-gradient(135deg, rgba(255, 255, 255, 0.05) 0%, rgba(255, 255, 255, 0) 50%, rgba(0, 0, 0, 0.5) 100%);
    backdrop-filter: blur(10px); /* Размытие фона */
    -webkit-backdrop-filter: blur(10px);
    pointer-events: none; /* Чтобы не мешало кликам, если будут */
  }

  /* Анимация вращения волн, чтобы создавался эффект "извилистости" */
  @keyframes rotateWave {
    0% {
      transform: rotate(0deg) scale(1);
    }
    50% {
      transform: rotate(180deg) scale(1.2);
    }
    100% {
      transform: rotate(360deg) scale(1);
    }
  }

</style>
</head>
<body>

  <!-- Контейнер с волнами -->
  <div class="waves-container">
    <div class="wave wave-1"></div>
    <div class="wave wave-2"></div>
    <div class="wave wave-3"></div>
  </div>

  <!-- Стеклянный слой поверх -->
  <div class="glass-overlay"></div>

</body>
</html>
