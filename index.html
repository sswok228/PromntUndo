<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Glass Gradient Background</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    /* Темный градиентный фон на заднем плане */
    background: linear-gradient(135deg, #000000 0%, #1a1a1a 100%);
    height: 100vh;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .waves-container {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 1;
    overflow: hidden;
  }

  /* Общие настройки для волн */
  .wave {
    position: absolute;
    width: 200vw;
    height: 200vh;
    top: -50vh;
    left: -50vw;
    border-radius: 40%; /* Скругляем углы, чтобы получить волну */
    filter: blur(60px); /* Сильное размытие для мягкости */
  }

  /* Градиентная волна 1 (перелив от белого к прозрачному) */
  .wave-1 {
    background: radial-gradient(circle at 50% 50%, rgba(255, 255, 255, 0.4) 0%, rgba(255, 255, 255, 0) 70%);
    animation: rotateWave 15s infinite linear;
  }

  /* Градиентная волна 2 (перелив от серого к прозрачному, работает в обратную сторону) */
  .wave-2 {
    background: radial-gradient(circle at 30% 70%, rgba(180, 180, 180, 0.3) 0%, rgba(180, 180, 180, 0) 70%);
    animation: rotateWave 22s infinite linear reverse;
  }

  /* Градиентная волна 3 (темно-серый перелив для объема) */
  .wave-3 {
    background: radial-gradient(circle at 70% 30%, rgba(100, 100, 100, 0.4) 0%, rgba(100, 100, 100, 0) 60%);
    animation: rotateWave 30s infinite linear;
  }

  /* Стеклянный слой (Glassmorphism) */
  .glass-overlay {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 2;
    /* Плавный градиент поверх волн, имитирующий блик на стекле */
    background: linear-gradient(135deg, rgba(255, 255, 255, 0.08) 0%, rgba(255, 255, 255, 0) 40%, rgba(0, 0, 0, 0.6) 100%);
    backdrop-filter: blur(15px); /* Размытие */
    -webkit-backdrop-filter: blur(15px);
    pointer-events: none;
  }

  /* Анимация вращения и пульсации (чтобы волны извивались) */
  @keyframes rotateWave {
    0% {
      transform: rotate(0deg) scale(1);
    }
    50% {
      transform: rotate(180deg) scale(1.1);
    }
    100% {
      transform: rotate(360deg) scale(1);
    }
  }

</style>
</head>
<body>

  <div class="waves-container">
    <div class="wave wave-1"></div>
    <div class="wave wave-2"></div>
    <div class="wave wave-3"></div>
  </div>

  <div class="glass-overlay"></div>

</body>
</html>
