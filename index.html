<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Promt Undo ❄️</title>
<!-- Подключаем современный шрифт Inter (как в Apple и Telegram) -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  
  body {
    /* Более насыщенный и современный градиент */
    background: linear-gradient(-45deg, #0f021a, #2a0845, #511b8a, #1a052e);
    background-size: 400% 400%;
    animation: gradientBG 15s ease infinite;
    
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    color: #fff;
    overflow-x: hidden;
  }

  @keyframes gradientBG {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  /* Эффект матового стекла для шапки (25% прозрачности) */
  header {
    background: rgba(20, 4, 33, 0.75); /* 75% непрозрачности = 25% прозрачности */
    backdrop-filter: blur(15px); /* Размытие заднего фона (современно) */
    -webkit-backdrop-filter: blur(15px);
    
    width: 92%;
    max-width: 800px;
    margin: 25px auto 0;
    padding: 15px 25px;
    border-radius: 50px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    /* Тонкая светлая рамка для объема */
    border: 1px solid rgba(255, 255, 255, 0.1);
    box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
    
    position: relative;
    z-index: 10;
  }

  .header-title {
    font-size: 1.6rem;
    font-weight: 900;
    letter-spacing: 1.5px;
    /* Убираем старый текст-шэдоу, делаем чистый белый цвет */
    color: #ffffff; 
  }

  /* Кнопка меню (три фиолетовые полоски) */
  .menu-btn {
    background: none;
    border: none;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    gap: 6px;
    padding: 5px;
    z-index: 12;
  }

  .menu-btn span {
    display: block;
    width: 28px;
    height: 3px;
    /* Современный светло-фиолетовый цвет */
    background-color: #d8b4fe; 
    border-radius: 5px;
    transition: all 0.3s ease;
  }

  /* Анимация полочек при наведении */
  .menu-btn:hover span {
    background-color: #ffffff;
  }

  /* Плавная шторка */
  .curtain {
    background: rgba(20, 4, 33, 0.95);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    
    position: absolute;
    top: 100%;
    left: 0;
    width: 100%;
    height: 0;
    overflow: hidden;
    transition: height 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    border-bottom-left-radius: 30px;
    border-bottom-right-radius: 30px;
    border: 1px solid rgba(255, 255, 255, 0.05);
    border-top: none;
    box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8); 
    z-index: 5;
  }

  /* Тёмный градиент на стыке (как ты просил) */
  .curtain::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 25px;
    background: linear-gradient(to bottom, rgba(0,0,0,0.9), transparent);
  }

  .curtain.open {
    height: 250px; 
  }

  .curtain-content {
    padding: 30px 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .curtain-content a {
    color: #d8b4fe;
    text-decoration: none;
    font-size: 1.1rem;
    font-weight: 700;
    padding: 12px 15px;
    border-radius: 12px;
    background: rgba(255, 255, 255, 0.03);
    transition: all 0.2s;
  }

  .curtain-content a:hover {
    background: rgba(255, 255, 255, 0.1);
    color: #fff;
    transform: translateX(5px);
  }

  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 0 20px;
  }

  p {
    font-size: 1.2rem;
    font-weight: 400;
    opacity: 0.7;
    max-width: 600px;
    line-height: 1.5;
  }

</style>
</head>
<body>

  <header>
    <div class="header-title">Promt Undo ❄️</div>
    
    <button class="menu-btn" onclick="toggleMenu()">
      <span></span>
      <span></span>
      <span></span>
    </button>

    <div class="curtain" id="myCurtain">
      <div class="curtain-content">
        <a href="#">Главная</a>
        <a href="#">О проекте</a>
        <a href="#">Настройки</a>
      </div>
    </div>
  </header>

  <main>
    <p>Добро пожаловать. Здесь начинается твой путь.</p>
  </main>

  <script>
    function toggleMenu() {
      var curtain = document.getElementById("myCurtain");
      curtain.classList.toggle("open");
    }
  </script>

</body>
</html>
